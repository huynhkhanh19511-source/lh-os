<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LH OS — an executable system for turning knowledge, architecture, and decisions into runtime feedback.">
  <title>LH OS</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0b0d10; color: #f2f4f7; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 32px; }
    .wrap { width: min(960px, 100%); }
    nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18vh; font-size: 14px; color: #a8b0bb; }
    .logo { color: #fff; font-weight: 700; letter-spacing: .08em; }
    nav a { color: #a8b0bb; text-decoration: none; }
    nav a:hover { color: #fff; }
    h1 { max-width: 820px; margin: 0; font-size: clamp(48px, 9vw, 96px); line-height: .98; letter-spacing: -.055em; }
    .accent { color: #8d96a3; }
    .lead { max-width: 650px; margin: 32px 0 48px; color: #a8b0bb; font-size: 19px; line-height: 1.65; }
    .loop { display: inline-block; border: 1px solid #292e35; padding: 14px 18px; color: #d8dde5; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    footer { margin-top: 18vh; color: #646d79; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="wrap">
      <nav>
        <div class="logo">LH OS</div>
        <a href="https://github.com/huynhkhanh19511-source/lh-os">GitHub ↗</a>
      </nav>

      <section>
        <h1>Turn ideas into <span class="accent">runtime feedback.</span></h1>
        <p class="lead">
          LH OS is an executable system for connecting knowledge, architecture, and decisions to real-world execution — then feeding what happens back into the system.
        </p>
        <div class="loop">Notion → GitHub → Runtime → Feedback → Notion</div>
      </section>

      <footer>Knowledge. Execution. Reality. Learning.</footer>
    </div>
  </main>
</body>
</html>
